[mod-name]
reskins-sprite-utils=Artisanal Reskins: Sprite Utils

[mod-description]
reskins-sprite-utils=A comprehensive set of standalone icon and sprite utilities for Factorio mod development. Originally developed to support the Artisanal Reskins ecosystem, this library provides robust tools for manipulating icons, sprites, and prototypes with full type safety and extensive validation.

[mod-setting-name]
reskins-sprite-utils-validation-behavior=Parameter validation behavior

[mod-setting-description]
reskins-sprite-utils-validation-behavior=Configures how validators report an invalid argument.

[string-mod-setting]
reskins-sprite-utils-validation-behavior-throw=Throw
reskins-sprite-utils-validation-behavior-log=Log
reskins-sprite-utils-validation-behavior-off=Off

[string-mod-setting-description]
reskins-sprite-utils-validation-behavior-throw=Raises an error and aborts startup.
reskins-sprite-utils-validation-behavior-log=Logs the error and continues.
reskins-sprite-utils-validation-behavior-off=Skips validation entirely.